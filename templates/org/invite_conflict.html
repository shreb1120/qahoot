{% extends "base.html" %}
{% block title %}Already in an organization — Qaboom{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-8rem)] flex items-center justify-center py-8">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md text-center">
    <h1 class="text-xl font-bold text-slate-900 mb-2">You're already in an organization</h1>
    <p class="text-sm text-slate-500 mb-5">
      Your account ({{ g.user.email }}) already belongs to
      <strong>{{ org.name }}</strong>.
      A user can only belong to one organization.
    </p>
    <a href="{{ url_for('dashboard.index') }}"
       class="inline-block px-5 py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-semibold no-underline hover:bg-indigo-700 transition">Go to dashboard</a>
  </div>
</div>
{% endblock %}
