{% extends "base.html" %}
{% block title %}Invite link expired — Qaboom{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-8rem)] flex items-center justify-center py-8">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md text-center">
    <h1 class="text-xl font-bold text-slate-900 mb-2">This invite link is no longer valid</h1>
    <p class="text-sm text-slate-500 mb-5">
      It may have expired (links are valid for 7 days) or already been used.
      Ask your team admin to generate a new one.
    </p>
    <a href="{{ url_for('auth.login') }}"
       class="inline-block px-5 py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-semibold no-underline hover:bg-indigo-700 transition">Back to sign in</a>
  </div>
</div>
{% endblock %}
