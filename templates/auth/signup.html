{% extends "base.html" %}
{% block title %}Create account — Qaboom{% endblock %}

{% block main %}
<div class="rp-auth">
  <div class="rp-auth-show">
    {% include "auth/_showcase.html" %}
  </div>

  <div class="rp-auth-form">
    <div class="rp-auth-inner">
      <div class="lg:hidden flex items-center gap-2 mb-6">
        <span class="w-2.5 h-2.5 rounded-sm bg-indigo-600" aria-hidden="true"></span>
        <span class="text-lg font-bold text-ink tracking-tight">Qaboom</span>
      </div>

      <h1 class="qb-section-title mb-1">Create your account</h1>
      <p class="text-sm text-muted mb-6">You'll set up your organization straight after signing up.</p>

      <div id="clerk-component" data-mode="sign-up" data-next="{{ next_url or '' }}"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ static_url('auth.js') }}"></script>
{% endblock %}
