# ─── Rate limiting zones ─────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=qb_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=qb_auth:10m rate=5r/s;

# ─── Redirect www to non-www (HTTP) ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name www.qaboom.io;

    server_tokens off;

    return 301 https://qaboom.io$request_uri;
}

# ─── Redirect HTTP → HTTPS ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name qaboom.io;

    server_tokens off;

    # Allow certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://qaboom.io$request_uri;
    }
}

# ─── Main server block (HTTPS) ───────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qaboom.io www.qaboom.io;

    server_tokens off;

    # ─── SSL (populated by certbot) ──────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/qaboom.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qaboom.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ─── Upload size (audio files can be large) ──────────────────────────
    client_max_body_size 100M;

    # ─── Security headers ────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ─── Block common exploit paths ──────────────────────────────────────
    location ~ /\.(env|git|svn|htaccess|htpasswd|DS_Store) {
        deny all;
        return 404;
    }

    # ─── Auth endpoints with rate limiting ───────────────────────────────
    location /auth/ {
        limit_req zone=qb_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── All other routes ────────────────────────────────────────────────
    location / {
        limit_req zone=qb_general burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout for async call processing
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
