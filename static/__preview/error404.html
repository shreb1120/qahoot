<!--
QABOOM — DIRECTION CONTRACT (canon: call-intelligence category, full fidelity)
THESIS: The graded call is the artifact. This surface owns the loop "read the
  finding, hear the moment, judge it" — and refuses the vertical stack of
  rounded cards with the transcript dumped at the bottom and a naked browser
  audio control, which is what made it read as unfinished.
OWN-WORLD: Category canon, per the owner's chosen bar (Gong / Chorus /
  Observe.ai). Near-neutral ground, white panels, 1px hairlines, 6px radius,
  no decorative shadow. Dense small type, tabular figures everywhere numeric.
  Two speaker colours as data, not decoration. Semantic colour reserved for
  verdicts so nothing competes with pass/fail.
STORY: A reviewer opens a graded call, sees the verdict and where the call went
  wrong on a timeline, plays straight to that moment, reads the evidence
  beside it, and approves or flags the item without losing their place.
FIRST VIEWPORT: verdict + call identity header; full-width sticky transport
  with a real speaker timeline and evidence markers on it; then scorecard and
  items as the working column with the synced transcript as its right rail.
FORM: category canon, taken via the standing exit (no direction roll — the
  owner asked for the familiar path in plain words). Bar: Gong/Chorus/Observe.ai.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->

<script>
(function () {
  document.addEventListener('submit', function (e) {
    const form = e.target;
    if (!(form instanceof HTMLFormElement)) return;

    const confirmMsg = form.dataset.confirm;
    if (confirmMsg && !window.confirm(confirmMsg)) {
      e.preventDefault();
      return;
    }

    if (form.dataset.busyLabel === undefined) return;

    if (form.dataset.submitted === '1') { e.preventDefault(); return; }
    // Native validation runs before this fires only for valid forms; guard anyway
    // so a rejected submit does not leave the button stuck in its busy state.
    if (typeof form.checkValidity === 'function' && !form.checkValidity()) return;

    form.dataset.submitted = '1';
    const btn = form.querySelector('button[type="submit"], input[type="submit"]');
    if (!btn) return;
    btn.dataset.idleLabel = btn.textContent;
    if (form.dataset.busyLabel) btn.textContent = form.dataset.busyLabel;
    btn.setAttribute('aria-busy', 'true');
    // Deferred: disabling a submit button synchronously drops it from the payload.
    setTimeout(function () { btn.disabled = true; }, 0);
  });

  // Restore after a back-navigation, which serves the page from bfcache with
  // the button still disabled from the previous submit.
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    document.querySelectorAll('form[data-busy-label]').forEach(function (form) {
      form.dataset.submitted = '';
      const btn = form.querySelector('button[type="submit"], input[type="submit"]');
      if (!btn) return;
      btn.disabled = false;
      btn.removeAttribute('aria-busy');
      if (btn.dataset.idleLabel) btn.textContent = btn.dataset.idleLabel;
    });
  });
})();
</script>
